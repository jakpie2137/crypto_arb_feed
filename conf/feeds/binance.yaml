# Binance Spot Feed Configuration
# Disabled to save resources; re-enable when needed. Active feeds: GATE, GATEFUT, BINANCEFUT, BITGET, KUCOIN, MEXC.
appId: "feed_binance"
enabled: false

defaults:
  orderbookStaleThresholdMs: 10000       # 10s
  reconnectBatchStreamThresholdMs: 30000 # 30s
  depth: 20                              # orderbook depth

# Binance spot uses symbols without separator (BTCUSDT)
symbols:
- BTCUSDT
- ETHUSDT
- SOLUSDT
- BNBUSDT
- XRPUSDT
- ADAUSDT
- DOGEUSDT
- AVAXUSDT
- LINKUSDT
- DOTUSDT
- LTCUSDT
- BCHUSDT
- UNIUSDT
- ATOMUSDT
- APTUSDT
- ARBUSDT
- OPUSDT
- NEARUSDT
- INJUSDT
- SUIUSDT
- FILUSDT
- TIAUSDT
- WIFUSDT
- PEPEUSDT
- MATICUSDT
