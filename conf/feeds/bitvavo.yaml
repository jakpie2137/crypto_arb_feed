# Bitvavo Spot Feed Configuration
# Struktura jak Bitget/Kucoin/MEXC. Na później: allowList, blocklist, API dla routera (re-check przy retry).
#
# Dwa tryby:
#   Standard: BITVAVO_USE_MARKET_DATA_PRO=false (default) – REST snapshot + delty, bez auth
#   Market Data Pro: BITVAVO_USE_MARKET_DATA_PRO=true + klucze API
#     – non-conflated L2, ~9× więcej wiadomości, startMdSeqNo/endMdSeqNo
#
# Klucze dla Market Data Pro (env lub pliki):
#   bitvavo_feed_key.txt, bitvavo_feed_secret.txt   – feed
#   bitvavo_api_key.txt, bitvavo_api_secret.txt     – reporter
#   bitvavo_trade_key.txt, bitvavo_trade_secret.txt – router (później)
#   (albo BITVAVO_FEED_KEY, BITVAVO_FEED_SECRET w env)
#
appId: "feed_bitvavo"
enabled: false  # Native EUR. Cross (EUR->USDT) w MM via cross1.

defaults:
  orderbookStaleThresholdMs: 10000
  reconnectBatchStreamThresholdMs: 30000
  batchSize: 50  # symbole per WebSocket; 200 symboli → 4 połączenia (50+50+50+50)

# Symbole w formacie Bitvavo API (BTC-EUR). Mapowanie do internal (BTCEUR) przez SymbolRegistry.
